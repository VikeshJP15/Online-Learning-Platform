<!DOCTYPE html>
<html>
<head>
    <title>My Courses</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🎓 My Courses</h1>

    <ul id="list"></ul>

    <script>
        let courses = JSON.parse(localStorage.getItem("myCourses")) || [];

        document.getElementById("list").innerHTML =
            courses.map(c => `<li>${c}</li>`).join("");
    </script>

</body>
</html>
